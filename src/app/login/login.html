<div class="container">
  <!-- Left Panel -->
  <div class="left-panel">
    <div class="content">
      <h1 class="title">Inicia sesión en<br>AGROPE-TECH</h1>
      <p class="subtitle">
        Si no tienes una cuenta<br><button href="#">Registrarte aquí!</button>
      </p>
    </div>
  </div>

  <!-- Character Image -->
  <img src="assets/image_login.png" class="character-image" alt="Character" />

  <!-- Right Panel -->
  <div class="right-panel">
    <div class="login-form">
      <form (ngSubmit)="validateLogin()">
        <div class="input-group">
          <div class="input-wrapper">
            <label for="email">Usuario</label>
            <input
              type="email"
              id="email"
              name="email"
              [(ngModel)]="email"
              placeholder="example@gmail.com"
            />
            <span class="input-icon">✉</span>
          </div>
          <div class="error-message" *ngIf="vacioEmail">
            <small>Email es obligatorio</small>
          </div>
        </div>

        <div class="input-group">
          <div class="input-wrapper">
            <label for="password">Contraseña</label>
            <input
              [type]="showPassword ? 'text' : 'password'"
              id="password"
              name="password"
              [(ngModel)]="password"
              placeholder="••••••••"
            />
            <span class="input-icon" (click)="togglePassword()">
              {{ showPassword ? '👁' : '👁' }}
            </span>
          </div>
          <div class="error-message" *ngIf="vacioPassword">
            <small>Contraseña es obligatoria</small>
          </div>
        </div>

        <button type="submit" class="btn-primary">
          Iniciar sesión
        </button>
      </form>

      <div class="divider"></div>
    </div>
  </div>
</div>
